[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrt-route"
version = "1.0.0"
description = "Fastest route visiting every Singapore MRT station (generalised open-loop Steiner TSP) with a web app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "ortools>=9.10", "numpy>=1.26", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
deploy = ["gunicorn>=22"]

[project.scripts]
mrt-route = "mrt_route.cli:main"

[tool.setuptools]
packages = ["mrt_route", "webapp"]

[tool.setuptools.package-data]
mrt_route = ["data/*.json"]
webapp = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
